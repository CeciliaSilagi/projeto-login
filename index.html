<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle" />
    <link rel = "stylesheet" href ="styles/style.css">
    <link rel = "stylesheet" href = "styles/media-queries.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="image">
            <!--Aqui vai a imagem  nas CSS-->
            </div>
            <div id="form">
             <h1>Login</h1>
             <p>Seja bem-vindo(a) novamente. Faça seu login para acessar sua conta e poder
                fazer as configurações no seu ambiente.</p>
                <form action="login.php" method="post">
                    <div class="field">
                       <i class="material-symbols-outlined">account_circle</i>
                       <input type="email" name="login" id="ilogin" placeholder="Digite seu e-mail" required>
                       <label for="ilogin">Login</label>
                    </div>
                    <div class="field">
                        <i class="material-symbols-outlined">password</i>
                        <input type="password" name="senha" id="isenha" placeholder="Digite sua senha" required>
                        <label for="isenha">Senha</label>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
